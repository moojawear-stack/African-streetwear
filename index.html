<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mooja Wear | Venda African Streetwear</title>
    <!-- Icons and Fonts -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Syncopate:wght@700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background-color: #080808 !important; 
            color: #ffffff !important; 
            line-height: 1.6;
        }
        .brand-heading { font-family: 'Syncopate', sans-serif; letter-spacing: -0.05em; text-transform: uppercase; }
        
        /* Announcement Banner */
        .announcement {
            background-color: #facc15;
            color: #000000;
            text-align: center;
            padding: 12px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid #1a1a1a;
        }

        .section-title {
            font-size: 20px;
            color: #facc15;
            margin: 60px auto 20px auto;
            max-width: 1200px;
            padding: 0 20px;
            border-left: 4px solid #facc15;
            padding-left: 10px;
        }

        /* --- HERO PRODUCT SLIDER STYLE --- */
        .hero-product {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
        }
        @media(min-width: 768px) {
            .hero-product { grid-template-columns: 1.2fr 1fr; }
        }

        /* Image Slider Wrapper */
        .slider-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border: 1px solid #1a1a1a;
            background-color: #121212;
        }
        .slider-track {
            display: flex;
            width: 200%; /* Space for 2 images side-by-side */
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .slider-slide {
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .slider-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .slider-label {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0,0,0,0.85);
            padding: 6px 12px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.1em;
            border: 1px solid #333;
        }
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            border: 1px solid #222;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            z-index: 10;
        }
        .slider-arrow:hover { background: #facc15; color: black; }
        .arrow-left { left: 10px; }
        .arrow-right { right: 10px; }

        /* Order Box Controls */
        select, .qty-input {
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #1a1a1a;
            padding: 14px;
            font-size: 16px;
            margin-bottom: 20px;
            font-family: inherit;
        }
        .size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .size-tab {
            background-color: #000000;
            color: white;
            border: 1px solid #1a1a1a;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .size-tab.active { background-color: #ffffff !important; color: #000000 !important; border-color: #ffffff !important; }
        
        .whatsapp-btn {
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            font-weight: bold;
            text-transform: uppercase;
            padding: 16px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.05em;
        }
        .whatsapp-btn:hover { background-color: #facc15; }

        /* --- 4 PRODUCT CATALOG GRID STYLE --- */
        .catalog-grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        @media(min-width: 992px) {
            .catalog-grid { grid-template-columns: repeat(4, 1fr); }
        }
        .catalog-card {
            background-color: #0f0f0f;
            border: 1px solid #1a1a1a;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .catalog-img-box {
            width: 100%;
            aspect-ratio: 1/1;
            background-color: #18181b;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 11px;
            text-align: center;
        }
        .catalog-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .catalog-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        .catalog-price { font-size: 13px; color: #a1a1aa; font-family: monospace; margin-bottom: 15px; }

        /* --- 3 LOOKBOOK GALLERY STYLE --- */
        .lookbook-grid {
            max-width: 1200px;
            margin: 0 auto 80px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media(min-width: 768px) {
            .lookbook-grid { grid-template-columns: repeat(3, 1fr); }
        }
        .lookbook-card {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4; /* Editorial portrait fit */
            background-color: #121212;
            border: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 12px;
            overflow: hidden;
        }
        .lookbook-card img { width: 100%; height: 100%; object-fit: cover; }
        .lookbook-tag {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-size: 10px;
            text-transform: uppercase;
            color: #a1a1aa;
            background-color: rgba(0,0,0,0.75);
            padding: 4px 8px;
            border: 1px solid #222;
        }

        /* Footer Layout Elements */
        footer { background-color: #030303; border-top: 1px solid #111; padding: 60px 20px; }
        .footer-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
        }
        @media(min-width: 768px) { .footer-grid { grid-template-columns: repeat(3, 1fr); } }
        .footer-col h4 { color: #666; font-size: 11px; margin-bottom: 15px; }
        .footer-col p { color: #888; font-size: 14px; }
        .social-row { display: flex; gap: 10px; margin-top: 15px; }
        .social-row a {
            width: 44px;
            height: 44px;
            background-color: #0a0a0a;
            border: 1px solid #222;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .social-row a:hover { background-color: #facc15; color: black; }
    </style>
</head>
<body>

    <!-- 1. TOP ANNOUNCEMENT BANNER -->
    <div class="announcement brand-heading">
        ⚡ FREE SHIPPING IN SOUTH AFRICA FOR THE FIRST 50 ORDERS • DROPPING SOON
    </div>

    <!-- 2. BRAND HEADER -->
    <header>
        <h1 class="brand-heading" style="color: #facc15; font-size: 32px;">MOOJA WEAR</h1>
        <p style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.25em; color: #666; margin-top: 5px;">Venda, Limpopo 🇿🇦</p>
    </header>

    <!-- SECTION TITLE: FEATURED HERO -->
    <div class="section-title brand-heading">Featured Drop</div>

    <!-- 3. HERO PRODUCT SECTION WITH SLIDER -->
    <main class="hero-product">
        
        <!-- Interactive Front/Back Slider Container -->
        <div class="slider-container">
            <button class="slider-arrow arrow-left" onclick="slideHero(0)"><i class="fa-solid fa-chevron-left"></i></button>
            <button class="slider-arrow arrow-right" onclick="slideHero(1)"><i class="fa-solid fa-chevron-right"></i></button>
            
            <div class="slider-track" id="heroTrack">
                <!-- Slide 1: Front View -->
                <div class="slider-slide">
