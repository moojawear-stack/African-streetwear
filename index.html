<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mooja Wear | Venda African Streetwear</title>
    <!-- Icons and Premium Typography -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,600;0,800;1,800&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* Base Setup Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #050505 !important; 
            color: #ffffff !important; 
            overflow-x: hidden;
        }
        .syncopate-title { font-family: 'Syncopate', sans-serif; letter-spacing: -0.04em; text-transform: uppercase; font-weight: 700; }
        
        /* Top Global Announcement Banner */
        .announcement-banner {
            background-color: #facc15;
            color: #000000;
            text-align: center;
            padding: 12px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* Navigation Header */
        header {
            max-width: 1300px;
            margin: 0 auto;
            padding: 25px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #151515;
        }
        .nav-links { display: flex; gap: 25px; }
        .nav-links a { color: #888; text-decoration: none; font-size: 13px; font-weight: 600; text-transform: uppercase; transition: 0.3s; }
        .nav-links a:hover { color: #facc15; }
        .shop-edit-btn { border: 1px solid #ffffff; padding: 8px 16px; font-size: 12px; text-transform: uppercase; font-weight: bold; color: white; text-decoration: none; transition: 0.3s; }
        .shop-edit-btn:hover { background-color: white; color: black; }

        /* Hero Text Showcase Section */
        .hero-section { max-width: 1300px; margin: 60px auto; padding: 0 20px; text-align: left; }
        .hero-tagline { font-size: 12px; color: #a1a1aa; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 15px; display: block; }
        .hero-title { font-size: clamp(40px, 7vw, 90px); line-height: 0.9; margin-bottom: 30px; font-weight: 800; italic: true; }
        .hero-desc { max-width: 600px; color: #888; font-size: 16px; line-height: 1.6; margin-bottom: 30px; }

        /* --- 01 / SIGNATURE PRODUCT WORKBENCH WITH FRONT-BACK SWIPE --- */
        .product-workbench {
            max-width: 1300px;
            margin: 40px auto 100px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 50px;
        }
        @media(min-width: 992px) { .product-workbench { grid-template-columns: 1.2fr 1fr; gap: 80px; } }

        /* Left Column: Interactive Front/Back Swipe Box Container */
        .preview-box { position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: hidden; background-color: #0f0f0f; border: 1px solid #151515; }
        .preview-track { display: flex; width: 200%; height: 100%; transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .preview-image { width: 50%; height: 100%; position: relative; }
        .preview-image img { width: 100%; height: 100%; object-fit: cover; }
        .preview-label { position: absolute; top: 20px; left: 20px; font-size: 11px; font-weight: bold; background: rgba(0,0,0,0.85); padding: 5px 10px; border: 1px solid #333; letter-spacing: 0.1em; }
        
        .slider-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .slide-counter { font-size: 13px; color: #666; font-family: monospace; }
        .circle-arrows { display: flex; gap: 10px; }
        .circle-arrow-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #222; background: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: 0.3s; }
        .circle-arrow-btn:hover { background-color: #ffffff; color: #000000; border-color: #ffffff; }

        /* Right Column: Checkout Configuration Panel */
        .order-panel { display: flex; flex-direction: column; justify-content: center; }
        .panel-meta { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 0.1em; display: block; margin-bottom: 10px; }
        .panel-title { font-size: 36px; font-weight: 800; line-height: 1.1; margin-bottom: 10px; text-transform: uppercase; }
        .panel-price { font-size: 24px; font-weight: 700; color: #facc15; font-family: monospace; margin-bottom: 30px; }
        
        .input-group { margin-bottom: 25px; }
        .input-label { display: block; font-size: 11px; font-weight: bold; text-transform: uppercase; color: #a1a1aa; letter-spacing: 0.1em; margin-bottom: 8px; }
        
        /* Select & Input Styling overrides */
        select { width: 100%; background-color: #000000; color: white; border: 1px solid #1a1a1a; padding: 16px; font-size: 15px; font-family: inherit; cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='10' height='10' fill='white'><polygon points='0,0 10,0 5,5'/></svg>"); background-repeat: no-repeat; background-position: right 16px center; }
        
        /* Premium Custom Size Selectors Grid */
        .size-box-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
        .size-box-item { background: #000000; color: white; border: 1px solid #1a1a1a; padding: 14px 0; text-align: center; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .size-box-item.selected { background: #ffffff !important; color: #000000 !important; border-color: #ffffff !important; }
        
        .whatsapp-submit-btn { width: 100%; background: #ffffff; color: #000000; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; padding: 18px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; transition: 0.3s; margin-top: 15px; }
        .whatsapp-submit-btn:hover { background: #facc15; }

        /* --- STYLISH INFINITE SCROLLING TEXT MARQUEE --- */
        .marquee-wrapper { background: #000000; border-top: 1px solid #151515; border-bottom: 1px solid #151515; padding: 20px 0; overflow: hidden; display: flex; white-space: nowrap; }
        .marquee-content { display: inline-flex; animation: scrollMarquee 25s linear infinite; font-size: 15px; font-weight: 800; letter-spacing: 0.1em; color: #facc15; text-transform: uppercase; }
        .marquee-content span { padding: 0 20px; display: flex; align-items: center; gap: 15px; }
        @keyframes scrollMarquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }

        /* --- 02 / 6-PRODUCT COLLECTION CAROUSEL SECTION --- */
        .collection-section { max-width: 1300px; margin: 100px auto; padding: 0 20px; position: relative; }
        .section-header-block { margin-bottom: 40px; border-left: 5px solid #facc15; padding-left: 15px; }
        .section-header-block h2 { font-size: 32px; font-weight: 800; line-height: 1.1; }
        .section-header-block p { color: #666; font-size: 14px; margin-top: 5px; }
        
        .carousel-view-window { width: 100%; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; display: flex; gap: 25px; padding-bottom: 20px; }
        .carousel-view-window::-webkit-scrollbar { display: none; } /* Hide default slider bars */
        
        .product-card { min-width: 290px; width: 290px; background-color: #0c0c0c; border: 1px solid #151515; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
        @media(min-width: 768px) { .product-card { min-width: 380px; width: 380px; } }
        
        .card-img-placeholder { width: 100%; aspect-ratio: 1/1; background-color: #121212; display: flex; align-items: center; justify-content: center; color: #444; font-size: 12px; font-weight: bold; overflow: hidden; position: relative; margin-bottom: 20px; }
        .card-img-placeholder img { width: 100%; height: 100%; object-fit: cover; }
        .card-title { font-size: 16px; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
        .card-price { font-size: 14px; color: #a1a1aa; font-family: monospace; margin-bottom: 20px; }

        /* --- 03 / BRAND STORY HISTORY SLOTS --- */
        .story-section { background-color: #0a0a0a; border-top: 1px solid #121212; border-bottom: 1px solid #121212; padding: 100px 20px; }
        .story-container { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 50px; }
        @media(min-width: 768px) { .story-container { grid-template-columns: 1.2fr 1fr; items: center; } }
        .story-title { font-size: clamp(30px, 4vw, 50px); font-weight: 800; line-height: 1.1; margin-bottom: 25px; }
        .story-desc { color: #888; font-size: 16px; line-height: 1.7; margin-bottom: 40px; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; border-top: 1px solid #222; padding-top: 30px; }
        .stat-num { font-size: 20px; font-weight: 800; color: #facc15; display: block; }
        .stat-lbl { font-size: 11px; text-transform: uppercase; color: #666; letter-spacing: 0.1em; margin-top: 4px; }
